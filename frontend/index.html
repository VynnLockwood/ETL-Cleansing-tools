<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SPP Excel Import</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
  fieldset { margin: 1rem 0; }
  table { border-collapse: collapse; margin: .5rem 0 1rem; }
  th, td { border: 1px solid #bbb; padding: .25rem .5rem; text-align: left; }
  .err { color: #b00020; }
  .samples { color: #666; font-size: .85em; }
  [hidden] { display: none; }
</style>
</head>
<body>
<h1>SPP Excel Import</h1>

<fieldset>
  <legend>1. Upload</legend>
  <p><label>Admin password <input type="password" id="password" autocomplete="current-password"></label></p>
  <p><input type="file" id="file" accept=".xlsx,.xls"></p>
  <p><label><input type="checkbox" id="dictionary"> dictionary mode</label></p>
  <button type="button" id="upload">Upload</button>
</fieldset>

<p id="status" role="status"></p>

<section id="proposalSection" hidden>
  <h2>2. Proposal</h2>
  <div id="proposal"></div>
  <p><label><input type="checkbox" id="addAudit"> add standard audit columns</label></p>
  <button type="button" id="save">Save proposal</button>
  <button type="button" id="apply">Apply</button>
</section>

<section id="resultSection" hidden>
  <h2>3. Result</h2>
  <div id="result"></div>
</section>

<fieldset>
  <legend>Load data into existing tables</legend>
  <p>Each sheet is loaded into the table of the same name. Nothing is loaded if any row is rejected.</p>
  <p><input type="file" id="loadFile" accept=".xlsx,.xls"></p>
  <button type="button" id="load">Load</button>
  <div id="loadResult"></div>
</fieldset>

<script>
"use strict";
var state = { id: null, proposal: null };

function $(id) { return document.getElementById(id); }

function el(tag, text, attrs) {
  var e = document.createElement(tag);
  if (text !== undefined && text !== null) e.textContent = String(text);
  if (attrs) Object.keys(attrs).forEach(function (k) { e[k] = attrs[k]; });
  return e;
}

function setStatus(msg, isErr) {
  var s = $("status");
  s.textContent = msg;
  s.className = isErr ? "err" : "";
}

function api(method, path, body) {
  var headers = { "Authorization": "Basic " + btoa("admin:" + $("password").value) };
  var opts = { method: method, headers: headers };
  if (body instanceof FormData) {
    opts.body = body;
  } else if (body !== undefined) {
    headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  return fetch("/api" + path, opts).then(function (r) {
    return r.text().then(function (t) {
      var data = null;
      try { data = t ? JSON.parse(t) : null; } catch (e) { data = null; }
      return { ok: r.ok, status: r.status, data: data };
    });
  });
}

function fail(res, what) {
  var detail = res.status === 401 ? "wrong password" : "HTTP " + res.status;
  setStatus(what + " failed: " + detail, true);
}

function table(headers, rows) {
  var t = el("table");
  var hr = el("tr");
  headers.forEach(function (h) { hr.appendChild(el("th", h)); });
  t.appendChild(hr);
  rows.forEach(function (r) {
    var tr = el("tr");
    r.forEach(function (c) {
      var td = el("td");
      if (c instanceof Node) td.appendChild(c); else td.textContent = c;
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
  return t;
}

function renderIssues(parent, issues) {
  if (!issues || !issues.length) return;
  parent.appendChild(el("h3", "Issues (" + issues.length + ")"));
  parent.appendChild(table(["Sheet", "Column", "Row", "Message"],
    issues.map(function (i) { return [i.sheet || "", i.column || "", i.row || "", i.message || ""]; })));
}

function renderProposal(proposal, issues) {
  state.proposal = proposal;
  var root = $("proposal");
  root.textContent = "";
  (proposal.tables || []).forEach(function (t) {
    root.appendChild(el("h3", t.name));
    var rows = (t.columns || []).map(function (c) {
      var input = el("input", null, { type: "text", value: c.sqlType || "" });
      input.addEventListener("input", function () { c.sqlType = input.value; });
      return [c.name, input, c.nonNull ? "yes" : "no", c.distinct, c.unique ? "yes" : "no",
        el("span", (c.samples || []).join(", "), { className: "samples" })];
    });
    root.appendChild(table(["Column", "SQL type", "Not null", "Distinct", "Unique", "Samples"], rows));
    root.appendChild(el("p", "Primary key: " + ((t.primaryKey || []).join(", ") || "(none)")));
  });
  var fks = proposal.foreignKeys || [];
  if (fks.length) {
    root.appendChild(el("h3", "Foreign keys"));
    root.appendChild(table(["Table.column", "References", "Source", "Unmatched", "Accept"],
      fks.map(function (fk) {
        var cb = el("input", null, { type: "checkbox", checked: !!fk.accepted });
        cb.addEventListener("change", function () { fk.accepted = cb.checked; });
        return [fk.table + "." + fk.column, fk.refTable + "." + fk.refColumn, fk.source || "", fk.unmatched, cb];
      })));
  }
  $("addAudit").checked = !!proposal.addAudit;
  $("proposalSection").hidden = false;
  $("resultSection").hidden = true;
  var r = $("result");
  r.textContent = "";
  renderIssues(root, issues);
}

$("addAudit").addEventListener("change", function () {
  if (state.proposal) state.proposal.addAudit = $("addAudit").checked;
});

$("upload").addEventListener("click", function () {
  var f = $("file").files[0];
  if (!f) { setStatus("Choose a file first.", true); return; }
  var fd = new FormData();
  fd.append("file", f);
  if ($("dictionary").checked) fd.append("mode", "dictionary");
  setStatus("Uploading...");
  api("POST", "/imports", fd).then(function (res) {
    if (!res.ok || !res.data) { fail(res, "Upload"); return; }
    state.id = res.data.id;
    setStatus("Uploaded import " + state.id + ".");
    renderProposal(res.data.proposal, res.data.issues);
  }).catch(function (e) { setStatus("Upload failed: " + e.message, true); });
});

function save() {
  setStatus("Saving...");
  return api("PUT", "/imports/" + encodeURIComponent(state.id) + "/proposal", state.proposal).then(function (res) {
    if (!res.ok) { fail(res, "Save"); return false; }
    setStatus("Proposal saved.");
    return true;
  });
}

$("save").addEventListener("click", function () {
  if (state.id) save().catch(function (e) { setStatus("Save failed: " + e.message, true); });
});

$("apply").addEventListener("click", function () {
  if (!state.id) return;
  save().then(function (saved) {
    if (!saved) return;
    setStatus("Applying...");
    return api("POST", "/imports/" + encodeURIComponent(state.id) + "/apply").then(function (res) {
      if (!res.ok && res.status !== 422) { fail(res, "Apply"); return; }
      var d = res.data || {};
      var out = $("result");
      out.textContent = "";
      if (res.ok) {
        setStatus("Applied.");
        out.appendChild(el("p", "Created: " + ((d.created || []).join(", ") || "(none)")));
        out.appendChild(el("p", "Skipped: " + ((d.skipped || []).join(", ") || "(none)")));
      } else {
        setStatus("Apply rejected: fix the issues below.", true);
      }
      renderIssues(out, d.issues);
      $("resultSection").hidden = false;
    });
  }).catch(function (e) { setStatus("Apply failed: " + e.message, true); });
});

$("load").addEventListener("click", function () {
  var f = $("loadFile").files[0];
  if (!f) { setStatus("Choose a file to load first.", true); return; }
  var fd = new FormData();
  fd.append("file", f);
  var out = $("loadResult");
  out.textContent = "";
  setStatus("Loading...");
  api("POST", "/loads", fd).then(function (res) {
    if (!res.ok && res.status !== 422) { fail(res, "Load"); return; }
    var d = res.data || {};
    if (res.ok) {
      setStatus("Loaded.");
      var counts = d.rowsLoaded || {};
      out.appendChild(table(["Table", "Rows loaded"],
        Object.keys(counts).map(function (k) { return [k, counts[k]]; })));
    } else {
      setStatus("Load rejected: nothing was loaded. Fix the issues below.", true);
    }
    renderIssues(out, d.issues);
  }).catch(function (e) { setStatus("Load failed: " + e.message, true); });
});
</script>
</body>
</html>

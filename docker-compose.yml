services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      SPP_OWNER_PASSWORD: ${SPP_OWNER_PASSWORD:?set in .env}
      SPP_API_PASSWORD: ${SPP_API_PASSWORD:?set in .env}
      SPP_READER_PASSWORD: ${SPP_READER_PASSWORD:?set in .env}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://spp_api:${SPP_API_PASSWORD}@postgres:5432/spp
      MIGRATE_DATABASE_URL: postgresql://spp_owner:${SPP_OWNER_PASSWORD}@postgres:5432/spp
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
      UPLOAD_DIR: /data/uploads
      ADDR: ":8080"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
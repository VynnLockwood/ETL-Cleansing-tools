services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      SPP_OWNER_PASSWORD: ${SPP_OWNER_PASSWORD:?set in .env}
      SPP_API_PASSWORD: ${SPP_API_PASSWORD:?set in .env}
      SPP_READER_PASSWORD: ${SPP_READER_PASSWORD:?set in .env}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Separate variables (not URLs) so passwords need no URL encoding.
      SPP_API_PASSWORD: ${SPP_API_PASSWORD:?set in .env}
      SPP_OWNER_PASSWORD: ${SPP_OWNER_PASSWORD:?set in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set in .env}
      UPLOAD_DIR: /data/uploads
      SPP_DB_HOST: postgres
      SPP_DB_PORT: "5432"
      SPP_DB_NAME: spp
      SPP_API_USER: spp_api
      SPP_OWNER_USER: spp_owner
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  superset:
    build:
      context: ./superset
    restart: unless-stopped
    command: ["/app/docker/bootstrap.sh"]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?set in .env}
      SUPERSET_DB_PASSWORD: ${SUPERSET_DB_PASSWORD:?set in .env}
      SPP_READER_PASSWORD: ${SPP_READER_PASSWORD:?set in .env}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:?set in .env}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?set in .env}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:?set in .env}
      SUPERSET_APP_ROOT: /superset
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8088/superset/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
      - superset

volumes:
  postgres_data:
  uploads:
